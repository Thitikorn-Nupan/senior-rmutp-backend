server.port=8080
spring.main.banner-mode=off
spring.config.import=optional:info/my_info.properties
spring.application.name=ecommerce-backend
logging.level.root[0]=warn
logging.level.root[1]=info
spring.datasource.driver-class-name=${MYSQL_DRIVER}
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

#spring.datasource.driver-class-name=${MYSQLSERVER_DRIVER}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.datasource.url=${MYSQLSERVER_URL}
#spring.datasource.username=${MYSQLSERVER_USERNAME}
#spring.datasource.password=${MYSQLSERVER_PASSWORD}
spring.jpa.show-sql=true

