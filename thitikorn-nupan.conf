<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.

	ServerName www.thitikorn-nupan.com
	ServerAdmin webmaster@thitikorn-nupan
	# Note! DocumentRoot for setting base dir when you access url
	# Why thitikorn-nupan not working ?
	# DocumentRoot /var/www/html
    # DocumentRoot /var/www/thitikorn_nupan_test
    DocumentRoot /var/www/thitikorn-nupan


    # Set Proxy for redirect url to jar app
    # Enable proxy
    ProxyPreserveHost On
    ProxyRequests Off
    # Forward requests from the root URL to the Java application
    ProxyPass /service/reviews-book http://www.thitikorn-nupan.com:6161
    ProxyPassReverse /service/reviews-book http://www.thitikorn-nupan.com:6161

    # Forward requests from the root URL to the Java application
    ProxyPass /service/mentenance-system http://www.thitikorn-nupan.com:6262
    ProxyPassReverse /service/mentenance-system http://www.thitikorn-nupan.com:6262

    ProxyPass /service/ecomerce http://www.thitikorn-nupan.com:6060
    ProxyPassReverse /service/ecomerce http://www.thitikorn-nupan.com:6060


	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    

	
  # Have to set AllowOverride All if your angular don't set hash on routing
    <Directory /var/www/thitikorn-nupan/app/mentenance-system>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/thitikorn-nupan/app/reviews-book>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/thitikorn-nupan/app/ecommerce>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

</VirtualHost>
